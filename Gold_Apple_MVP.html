function infer(text){const t=text.toLowerCase();return Object.keys(goals).filter(k=>({dry:/сух|стяг|стянут|шелуш|увлаж|обезвож/,oil:/блес|жирн|себум|блест/,dull:/туск|сияни|свеж|неровн.*тон|ровн.*тон/}[k]).test(t));}
function recommend(goal,budget,sensitivity){
 if(!goals[goal])throw Error('Unknown goal');
 const cautious=sensitivity==='yes'||sensitivity==='unknown';
 const serum=cautious?'hydra':goals[goal].serum;
 const ids=['clean','cream',serum];
 if(budget>=2271 && goal!=='dry')ids.push('aqua');
 return ids.map(id=>products.find(p=>p.id===id)).filter(p=>p.price<=budget);
}

</script><script>(() => {
'use strict';
const {products,goals,infer,recommend}=CareModel;
const $=s=>document.querySelector(s), main=$('#main'), modal=$('#modal');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
let saved=[];try{const data=JSON.parse(localStorage.getItem('care-picks-v1')||'[]');if(Array.isArray(data))saved=data.filter(id=>products.some(p=>p.id===id));}catch{}
let state={view:'home',step:1,text:'',goal:null,budget:1000,sensitivity:'unknown',compare:[]},toastTimer,lastFocus;
const byId=id=>products.find(p=>p.id===id);
const icon=(filled=false)=>`<svg viewBox="0 0 24 24" aria-hidden="true"${filled?' style="fill:currentColor"':''}><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
function notify(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2500);}
function image(p,extra=''){return `<img src="${esc(p.image)}" alt="${esc(p.brand+' '+p.name)}" ${extra} referrerpolicy="no-referrer">`;}
function prepareImages(){document.querySelectorAll('img').forEach(img=>{img.addEventListener('error',()=>{const box=document.createElement('div');box.className='img-fallback';box.textContent=img.alt;const note=document.createElement('small');note.textContent='Фото доступно на странице магазина';box.append(document.createElement('br'),note);img.replaceWith(box);},{once:true});});}
function updateSaved(){ $('#saved-count').textContent=saved.length;const bottom=document.querySelector('.results-bottom [data-action="saved"]');if(bottom)bottom.textContent='Открыть мою подборку ('+saved.length+')';document.querySelectorAll('[data-action="save"]').forEach(b=>{let selected=saved.includes(b.dataset.id);b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));b.setAttribute('aria-label',(selected?'Убрать из подборки: ':'Сохранить: ')+byId(b.dataset.id).name);b.innerHTML=icon(selected);}); }
function render(focus=false){
 main.className='fade-in';
 if(state.view==='home')renderHome(); else if(state.view==='quiz')renderQuiz();else if(state.view==='results')renderResults();else renderSaved();
 updateSaved();renderComparebar();prepareImages();
 if(focus){const h=main.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}
}
function progress(){return `<div class="progress" aria-label="Ход подбора">${['Ваша потребность','Пара уточнений','Понятный выбор'].map((t,i)=>`<span class="${i+1===state.step?'active':i+1<state.step?'done':''}" ${i+1===state.step?'aria-current="step"':''}><i>${i+1<state.step?'✓':i+1}</i>${t}</span>`).join('')}</div>`;}
function needForm(){return `<form id="need-form" novalidate><label for="need" class="top-label">Расскажите своими словами</label><textarea id="need" class="need-input" maxlength="350" placeholder="Например: после умывания кожу стягивает, а в баночках я совсем не разбираюсь…" aria-describedby="need-hint need-error">${esc(state.text)}</textarea><div class="under-input"><span id="need-hint">Не нужно знать свой тип кожи или названия ингредиентов.</span><span id="char-count">${state.text.length}/350</span></div><p class="choice-label" id="goal-label">Или выберите то, что сейчас важнее</p><div class="goal-grid" role="radiogroup" aria-labelledby="goal-label">${Object.entries(goals).map(([id,g],i)=>`<label class="goal-card"><input type="radio" name="goal" value="${id}" ${state.goal===id?'checked':''}><span class="goal-symbol" aria-hidden="true">${['≈','◒','✳'][i]}</span><b>${g.label}</b></label>`).join('')}</div><div id="need-error" class="error" role="alert"></div><div class="form-actions"><button class="primary" type="submit">Продолжить</button><span class="small-meta">Три коротких шага.<br>Без регистрации.</span></div></form>`;}
function renderHome(){main.innerHTML=`<section class="intro"><div class="intro-copy"><span class="eyebrow">Ваш навигатор по уходу</span><h1>Не знаешь,<br>с чего начать<br><em>уход?</em></h1><p>Начнём с того, чего хочется вашей коже. Объясним, какие средства стоит рассмотреть и зачем.</p><button class="primary" data-action="start">Разобраться в уходе</button><span class="small-meta">Уход за лицом · около 2 минут · бесплатно</span></div><div class="hero-art" aria-label="Очищение, увлажнение и дополнительный уход"><div class="hero-word">ПОНЯТНО<br>ПРО УХОД.</div><div class="hero-line"></div><div class="hero-line two"></div><div class="hero-product">${image(byId('clean'))}</div><div class="hero-product two">${image(byId('hydra'))}</div><div class="hero-sticker">Сначала<br>потребность.<br>Потом баночки.</div><span class="hero-caption">Маленькая подборка.<br>Понятный следующий шаг.</span></div></section><div class="how-strip"><div><span>1</span>Опишите потребность</div><div><span>2</span>Уточните предпочтения</div><div><span>3</span>Сравните средства</div></div><div class="wrap"><section class="section" id="start"><div class="section-title"><div><span class="eyebrow">Начнём с вас</span><h2 style="margin:14px 0 0">Что хочется изменить?</h2></div><p>Не будем отправлять вас в бесконечный каталог.<br>Сначала определим направление.</p></div><div class="form-layout">${needForm()}<aside class="aside-note"><div class="big-icon" aria-hidden="true">✳</div><h3>Можно без бьюти-словаря</h3><p>«Стягивает после умывания» — уже хороший запрос. Поможем перевести его на язык категорий ухода.</p><div class="tags"><span class="tag">Очищение</span><span class="tag">Увлажнение</span><span class="tag">Дополнительный уход</span></div><p style="margin-top:24px">Для первой версии доступны три потребности: сухость, жирный блеск и тусклый вид кожи.</p></aside></div></section></div>`;bindNeed();}
function renderQuiz(){main.innerHTML=`<div class="wrap"><div class="crumb">Навигатор ухода / ${state.step===1?'Ваша потребность':'Пара уточнений'}</div><section class="section" style="padding-top:0">${progress()}<div class="section-title"><div><span class="eyebrow">${state.step===1?'Начнём с вас':'Подборка под ваш запрос'}</span><h1 style="font-size:2.8rem;margin:17px 0 0">${state.step===1?'Что хочется изменить?':'Ещё пара уточнений'}</h1></div></div><div class="form-layout">${state.step===1?needForm():detailsForm()}<aside class="aside-note"><h3>Вы выбираете направление</h3><p>Это отправная точка для выбора косметики. Никаких диагнозов и обещаний результата.</p><p>Товары можно сравнить, сохранить или открыть в каталоге магазина.</p><p>Если есть заболевание кожи, выраженное раздражение или боль, подбор ухода лучше обсудить со специалистом.</p></aside></div></section></div>`;if(state.step===1)bindNeed();else bindDetails();}
function bindNeed(){const area=$('#need');area.addEventListener('input',()=>{state.text=area.value;state.goal=null;document.querySelectorAll('input[name="goal"]').forEach(r=>r.checked=false);$('#char-count').textContent=state.text.length+'/350';$('#need-error').textContent='';});document.querySelectorAll('input[name="goal"]').forEach(r=>r.addEventListener('change',()=>{state.goal=r.value;state.text=goals[r.value].sample;area.value=state.text;$('#char-count').textContent=state.text.length+'/350';$('#need-error').textContent='';}));$('#need-form').addEventListener('submit',e=>{e.preventDefault();state.text=area.value.trim();if(!state.goal){const found=infer(state.text);if(found.length===1)state.goal=found[0];else{$('#need-error').textContent=found.length>1?'В запросе несколько потребностей. Выберите одну главную из трёх вариантов выше.':'Пока навигатор работает с тремя потребностями. Выберите подходящее направление выше.';return;}}state.view='quiz';state.step=2;render(true);});}
function detailsForm(){return `<form id="details-form"><div class="goal-summary"><small>Мы поняли вашу потребность как</small><b>${goals[state.goal].label}</b><br><button class="text-button" type="button" data-action="back">Изменить запрос</button></div><fieldset class="fields-group"><legend>Сколько комфортно потратить на одно средство?</legend><div class="option-row">${[[1000,'До 1 000 ₽'],[2500,'До 2 500 ₽'],[10000,'Без ограничения']].map(([v,l])=>`<label class="option"><input type="radio" name="budget" value="${v}" ${state.budget===v?'checked':''} required>${l}</label>`).join('')}</div><p class="group-help">Это лимит на один товар, а не на всю подборку. Цены ориентировочные.</p></fieldset><fieldset class="fields-group"><legend>Кожа часто реагирует на новые средства?</legend><div class="option-row">${[['yes','Да, бывает дискомфорт'],['no','Обычно нет'],['unknown','Не знаю']].map(([v,l])=>`<label class="option"><input type="radio" name="sensitivity" value="${v}" ${state.sensitivity===v?'checked':''} required>${l}</label>`).join('')}</div><p class="group-help">Если ответ «да» или «не знаю», не добавляем в подборку концентрированные активные сыворотки.</p></fieldset><div class="note">Не обязательно покупать всё. Покажем основу ухода, дополнительный этап и, если позволяет бюджет, альтернативу крему.</div><div class="form-actions"><button type="button" class="text-button" data-action="back">Назад</button><button class="primary" type="submit">Показать мой уход</button></div></form>`;}
function bindDetails(){$('#details-form').addEventListener('change',e=>{if(e.target.name==='budget')state.budget=Number(e.target.value);if(e.target.name==='sensitivity')state.sensitivity=e.target.value;});$('#details-form').addEventListener('submit',e=>{e.preventDefault();state.view='results';state.step=3;state.compare=[];render(true);});}
function why(p){if(p.category==='cleanser')return 'Первый этап: помогает смыть повседневные загрязнения. Это очищение, а не отдельное средство для лечения кожи.';if(p.id==='aqua')return 'Альтернатива базовому крему: гелевая текстура для нормальной и жирной кожи. Выберите один из двух кремов.';if(p.category==='cream')return state.goal==='oil'?'Увлажнение остаётся частью ухода, даже если беспокоит жирный блеск. Это более доступный вариант крема.':'Базовый увлажняющий этап. Именно с него удобно начать выбор, если после очищения не хватает комфорта.';if((state.sensitivity==='yes'||state.sensitivity==='unknown')&&state.goal!=='dry')return 'Вместо концентрированного актива оставили увлажняющий вариант. Это не гарантия переносимости: в составе есть отдушка и ниацинамид.';return goals[state.goal]?.why||p.description;}
function badge(p){return p.id==='aqua'?'АЛЬТЕРНАТИВА КРЕМУ':p.category==='serum'?'ПО ЖЕЛАНИЮ':'ОСНОВА УХОДА';}
function card(p){return `<article class="product"><div class="product-image"><button data-action="detail" data-id="${p.id}" aria-label="Подробнее: ${esc(p.name)}">${image(p)}</button><button class="save-icon" data-action="save" data-id="${p.id}" aria-pressed="false" aria-label="Сохранить: ${esc(p.name)}">${icon()}</button><span class="product-badge">${badge(p)}</span></div><p class="product-category">${p.kind}</p><p class="product-brand">${esc(p.brand)}</p><button class="product-name" data-action="detail" data-id="${p.id}">${esc(p.name)}</button><span class="product-volume">${p.volume}</span><div class="price">от ${money(p.price)}</div><span class="price-note">Ориентир по каталогу ЗЯ</span><div class="why"><b>${state.view==='saved'?'Что это за средство':'Почему в подборке'}</b><p>${esc(state.view==='saved'?p.description:why(p))}</p></div><div class="product-buttons"><a class="shop-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${p.catalogLink?'В каталоге ЗЯ':'Открыть в ЗЯ'}</a><label class="compare-label"><input type="checkbox" data-compare="${p.id}" ${state.compare.includes(p.id)?'checked':''}>Сравнить</label></div></article>`;}
function renderResults(){const g=goals[state.goal],list=recommend(state.goal,state.budget,state.sensitivity);main.innerHTML=`<div class="wrap"><div class="crumb">Навигатор ухода / Ваша подборка</div><div class="result-top"><div><span class="eyebrow">Теперь понятнее</span><h1>${g.headline}</h1></div><button class="secondary" data-action="edit">Изменить ответы</button></div><div class="result-context"><span class="context-tag">${g.label}</span><span class="context-tag">${state.budget===10000?'Цена без ограничения':'До '+money(state.budget)+' за средство'}</span><span class="context-tag">${state.sensitivity==='no'?'Обычно без реакции на новые средства':state.sensitivity==='yes'?'Бывает реакция на новые средства':'Чувствительность не определена'}</span></div><section class="explain"><div><span class="mini-label">Какие категории искать</span><h2>Сначала база.<br>Потом дополнения.</h2><p>${g.text}</p></div><div class="routine"><div><span class="category-icon" aria-hidden="true">≈</span><b>Очищение</b><small>Гель или пенка, чтобы смыть загрязнения. Средство смывают водой.</small></div><div><span class="category-icon" aria-hidden="true">◒</span><b>Увлажнение</b><small>Крем или гель-крем для комфорта кожи. В подборке выбирайте один крем.</small></div><div><span class="category-icon" aria-hidden="true">✳</span><b>Дополнительный уход</b><small>Сыворотка под конкретный запрос. Можно обойтись без неё и начать с базы.</small></div></div></section>${state.sensitivity!=='no'?'<p class="result-caution">Концентрированные сыворотки с ниацинамидом 10% и витамином C исключены. Увлажняющие средства тоже могут вызвать индивидуальную реакцию — проверьте состав и инструкцию.</p>':''}<div class="results-heading"><div><h2>Ваш небольшой список</h2><p>${list.length} средства · не нужно покупать всё</p></div><button class="text-button" data-action="save-all">Сохранить подборку</button></div><div class="cards ${list.length===3?'three':''}">${list.map(card).join('')}</div><div class="results-bottom"><div><p>Цены — ориентиры по страницам российского каталога ЗЯ, проверенным 23.11.2026. Они могут зависеть от объёма, авторизации и акций. Наличие и конечную цену уточняйте в магазине.</p><p>Это список для выбора, а не готовое назначение. При дневном уходе учитывайте также защиту от солнца; SPF не включён в эту небольшую подборку.</p><button class="text-button" data-action="sources">Посмотреть источники и ограничения</button></div><div><button class="secondary" data-action="saved">Открыть мою подборку (${saved.length})</button><p>Сохранится только на этом устройстве. Аккаунт не нужен.</p></div></div></div>`;}
function renderSaved(){const list=saved.map(byId).filter(Boolean);main.innerHTML=`<div class="wrap"><div class="saved-heading"><div><span class="eyebrow">Выбрано вами</span><h1>Моя подборка</h1><p>Сохранённые средства на этом устройстве. Это список для выбора, не корзина магазина.</p></div><button class="secondary" data-action="${state.goal?'results':'home'}">${state.goal?'Вернуться к результату':'Подобрать уход'}</button></div>${list.length?`<div class="cards ${list.length===3?'three':''}">${list.map(card).join('')}</div><div class="saved-total">Сохранено средств: ${list.length}<strong>от ${money(list.reduce((a,p)=>a+p.price,0))}</strong><p>Сумма ориентировочная. В списке могут быть альтернативы — не обязательно покупать все средства вместе.</p><div class="option-row" style="margin-top:20px"><button class="secondary" data-action="download">Скачать список</button><button class="text-button" data-action="clear-saved">Очистить подборку</button></div></div>`:`<div class="empty"><h2>Здесь будут средства,<br>которые вы выберете</h2><p>Нажмите на значок закладки на карточке товара — и он останется в вашей подборке.</p><button class="primary" data-action="${state.goal?'results':'home'}">${state.goal?'К результатам подбора':'Начать подбор'}</button></div>`}</div>`;}
function save(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();if(state.view==='saved')render();else updateSaved();notify(saved.includes(id)?'Средство сохранено в «Мою подборку»':'Средство убрано из подборки');}
function persist(){try{localStorage.setItem('care-picks-v1',JSON.stringify(saved));}catch{notify('В этом браузере сохранение недоступно. Скачайте список.');}}
function renderComparebar(){const b=$('#comparebar');b.hidden=!state.compare.length;b.innerHTML=state.compare.length?`<span>Выбрано для сравнения: ${state.compare.length} из 3</span><div><button class="clear" data-action="clear-compare">Сбросить</button><button class="primary lime" data-action="compare" ${state.compare.length<2?'disabled':''}>${state.compare.length<2?'Выберите ещё средство':'Сравнить средства'}</button></div>`:'';document.body.style.paddingBottom=state.compare.length?'78px':'';}
function showModal(title,body){lastFocus=document.activeElement;$('#modal-content').innerHTML=`<div class="modal-header"><h2 id="modal-title">${title}</h2><button class="close" data-action="close" aria-label="Закрыть окно">×</button></div><div class="modal-body">${body}</div>`;modal.setAttribute('aria-labelledby','modal-title');if(!modal.open)modal.showModal();prepareImages();}
function detail(id){const p=byId(id);showModal(esc(p.kind),`<div class="detail"><div>${image(p)}</div><div><span class="eyebrow">${esc(p.brand)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><p><b>${p.volume} · от ${money(p.price)}</b><br>Ориентировочная цена, без проверки остатков.</p><button class="secondary" data-action="save-detail" data-id="${p.id}">${saved.includes(id)?'Убрать из подборки':'Сохранить средство'}</button><a class="primary" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${p.catalogLink?'Смотреть в каталоге ЗЯ':'Посмотреть в ЗЯ'}</a></div></div><h3>Что в составе</h3><p>${esc(p.components)}. Это ключевые компоненты, не полный состав. Полный INCI проверяйте у продавца.</p><h3>Какой это этап</h3><p>${esc(p.use)}</p><p>${p.id==='aqua'?'Ссылка ведёт в каталог бренда: выберите Hyaluronic Acid Aqua Gel Cream.':p.id==='cream'?'Ссылка ведёт на страницу товара с отзывами и описанием в ЗЯ.':''}</p>`);}
function showCompare(){const list=state.compare.map(byId);showModal('Сравните и выберите',`<p>Одинаковые категории — альтернативы. Разные категории выполняют разные задачи.</p><div class="compare-table-wrap"><table class="compare-table"><tbody><tr><th scope="row">Средство</th>${list.map(p=>`<td>${image(p)}<b>${esc(p.brand)}</b><br>${esc(p.name)}</td>`).join('')}</tr>${[['Категория',p=>p.kind],['Цена, ориентир',p=>'от '+money(p.price)],['Объём',p=>p.volume],['Текстура',p=>p.texture],['Компоненты',p=>p.components],['Задача',p=>p.description]].map(([label,fn])=>`<tr><th scope="row">${label}</th>${list.map(p=>`<td>${esc(fn(p))}</td>`).join('')}</tr>`).join('')}<tr><th scope="row">Выбор</th>${list.map(p=>`<td><button class="text-button" data-action="save-detail" data-id="${p.id}">${saved.includes(p.id)?'Убрать из подборки':'Сохранить'}</button></td>`).join('')}</tr></tbody></table></div>`);}
function sources(){showModal('Товары и источники',`<p>Учебный прототип для проверки сценария выбора. Не является официальным продуктом ЗЯ. Подборки составлены по заранее заданным правилам, без диагностики и доступа к аккаунту магазина.</p><p>Ассортимент и ориентиры цен сверены с российским каталогом ЗЯ 23.11.2026. Это не проверка остатков для конкретного города. Цены с авторизацией и акциями могут измениться.</p><div class="source-list">${products.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.brand+' '+p.name)}<small>${p.volume} · ориентир от ${money(p.price)}${p.catalogLink?' · ссылка на каталог бренда':''}</small></a>`).join('')}</div><h3>Фотографии</h3><p>Фото упаковок: ЛЭТУАЛЬ (ART\\FACT гель и Vitamin C), «Улыбка радуги» (крем ARAVIA), Kristaller (сыворотка ARAVIA), Pharmacosmetica (ART\\FACT Niacinamide), Walmart (Isntree). Дизайн упаковки у продавца может отличаться.</p><h3>Как учитываются ответы</h3><p>Потребность выбирает дополнительную сыворотку. При ответе о чувствительности «да» или «не знаю» концентрированные активные сыворотки исключаются. Бюджет ограничивает ориентировочную цену одного средства. При бюджете от 2 500 ₽ для жирного блеска и тусклого вида добавляется гель-крем Isntree как альтернатива.</p><p>Сервис не оценивает совместимость всех ингредиентов и не учитывает аллергии. Полный состав и ограничения производителя нужно проверять перед использованием. Сохранённые товары хранятся только в браузере; текст запроса на сервер не отправляется.</p>`);}
function about(){showModal('Из потребности — в понятный уход',`<h3>Расскажите, чего хочется</h3><p>Опишите ощущения своими словами или выберите один из трёх вариантов. Если запрос неоднозначный, навигатор попросит уточнить главное.</p><h3>Уточните два момента</h3><p>Бюджет на одно средство и реакцию кожи на новую косметику. Они влияют на состав небольшого списка.</p><h3>Разберитесь в категориях</h3><p>Сначала вы увидите, зачем нужны очищение, крем и дополнительный уход. Затем — несколько реальных средств с объяснением выбора.</p><h3>Сравните и сохраните</h3><p>Сравните до трёх средств, сохраните интересные и откройте их в ЗЯ. Покупку и проверку наличия продолжайте в магазине.</p><div class="note">Первая версия — только уход за лицом и три потребности. Подбор бесплатный, без регистрации.</div>`);}
function download(){const lines=['МОЯ ПОДБОРКА УХОДА','Учебный прототип · 23.11.2026','',...saved.map(id=>{const p=byId(id);return `${p.brand} — ${p.name}\n${p.kind}, ${p.volume}\nОриентир: от ${money(p.price)}\n${p.url}\n`;}),'Цены ориентировочные; наличие и конечную цену проверьте в ЗЯ.','Средства могут быть альтернативами. Не обязательно покупать всё.','Навигатор не ставит диагнозы и не назначает лечение.'];const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Моя_подборка_ухода.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notify('Список подготовлен для скачивания');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='home'){state.view='home';state.step=1;state.compare=[];render(true);}else if(a==='start'){document.querySelector('#start').scrollIntoView({behavior:'smooth'});$('#need').focus({preventScroll:true});}else if(a==='back'){state.view='quiz';state.step=1;render(true);}else if(a==='edit'){state.view='quiz';state.step=2;state.compare=[];render(true);}else if(a==='results'){state.view='results';state.step=3;render(true);}else if(a==='saved'){state.view='saved';state.compare=[];render(true);}else if(a==='save')save(id);else if(a==='save-detail'){save(id);b.textContent=saved.includes(id)?'Убрать из подборки':'Сохранить';}else if(a==='save-all'){saved=[...new Set([...saved,...recommend(state.goal,state.budget,state.sensitivity).map(p=>p.id)])];persist();render();notify('Средства сохранены в «Мою подборку»');}else if(a==='clear-saved'){saved=[];persist();render();notify('Подборка очищена');}else if(a==='detail')detail(id);else if(a==='about')about();else if(a==='sources')sources();else if(a==='close')modal.close();else if(a==='clear-compare'){state.compare=[];document.querySelectorAll('[data-compare]').forEach(c=>c.checked=false);renderComparebar();}else if(a==='compare')showCompare();else if(a==='download')download();});
document.addEventListener('change',e=>{if(!e.target.dataset.compare)return;const id=e.target.dataset.compare;if(e.target.checked){if(state.compare.length===3){e.target.checked=false;notify('Можно сравнить не больше трёх средств');return;}state.compare.push(id);}else state.compare=state.compare.filter(x=>x!==id);renderComparebar();});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});modal.addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});
render();
})();
</script></body></html>
